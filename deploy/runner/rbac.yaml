# Учетная запись runner'а CI/CD: права только на пространство digital-mine (деплой нашего чарта)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: digital-mine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: digital-mine
rules:
  - apiGroups: ["", "apps", "autoscaling", "networking.k8s.io", "rbac.authorization.k8s.io", "batch", "policy"]
    resources: [deployments, replicasets, services, configmaps, secrets, serviceaccounts, pods, pods/log, events,
                horizontalpodautoscalers, ingresses, roles, rolebindings, jobs, persistentvolumeclaims, poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: digital-mine
subjects:
  - {kind: ServiceAccount, name: ci-deployer, namespace: digital-mine}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-deployer}
