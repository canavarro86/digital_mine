# Образы. До CI/CD: локальная сборка (dm-py:dev, dm-web:dev) + k3d image import.
# После CI/CD: registry=ghcr.io/canavarro86/, tag=<git sha>.
image:
  registry: ""
  py: digital-mine-py
  web: digital-mine-web
  tag: dev
  pullPolicy: IfNotPresent
  pullSecrets: []

existingSecret: dm-secrets
# Папка mines/ проекта, смонтированная в узел k3d (scripts/up.sh)
minesHostPath: /mnt/mines

env:
  DM_LOG_LEVEL: INFO
  DM_PG_HOST: postgres
  DM_CH_HOST: clickhouse
  DM_MINIO_ENDPOINT: minio:9000
  DM_NATS_URL: nats://nats:4222
  DM_PROMETHEUS_URL: http://prometheus-server.monitoring.svc
  DM_GRAFANA_URL: http://grafana.monitoring.svc/grafana
  DM_CALC_URL: http://calc:8000
  DM_IMPORTER_URL: http://importer:8000
  DM_ANALYZER_URL: http://analyzer:8000
  DM_EMULATOR_URL: http://emulator:8000
  DM_API_URL: http://api:8000

# Деплой без простоя (api, web): новый под поднимается раньше, чем гасится старый; PDB держит минимум 1 под;
# preStopSleep — пауза перед SIGTERM, пока Traefik убирает под из маршрутов (иначе 502 и обрывы на переключении)
zeroDowntime: &zeroDowntime
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  pdb: {minAvailable: 1}
  preStopSleep: 10

# Сервисы на Python: один образ, разные команды.
# preStopSleep у calc, importer, analyzer: api ходит к ним через ClusterIP, пауза даёт kube-proxy убрать старый под
# из Service до SIGTERM (иначе запрос api на переключении получает connection refused → 502 пользователю).
# replicas — число подов. Если у сервиса есть hpa, replicas = minReplicas HPA (поле replicas в Deployment не пишется).
services:
  api:
    module: api.main:app
    mines: true
    # без состояния в памяти: сессия — JWT (HS256, общий JWT_SECRET), данные в PostgreSQL/MinIO;
    # миграции и начальные данные при старте — под pg_advisory_lock (одна реплика заполняет, другие ждут)
    replicas: 2
    # замер kubectl top: без нагрузки 3–10m и 122–138Mi на под; под эмулятором ×60 ≈ 600m суммарно.
    # 100m × 70% = 70m в среднем на под: в простое 2 реплики, под нагрузкой эмулятора — 3
    hpa: {max: 3, cpu: 70}
    <<: *zeroDowntime
    resources:
      requests: {cpu: 100m, memory: 160Mi}
      limits: {memory: 320Mi}
  calc:
    module: calc.main:app
    preStopSleep: 5
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 90Mi}
      limits: {memory: 160Mi}
    hpa: {max: 3, cpu: 70}
  importer:
    module: importer.main:app
    preStopSleep: 5
    mines: true
    replicas: 1
    resources:
      requests: {cpu: 20m, memory: 100Mi}
      limits: {memory: 220Mi}
  analyzer:
    module: analyzer.main:app
    preStopSleep: 5
    replicas: 1
    resources:
      requests: {cpu: 20m, memory: 120Mi}
      limits: {memory: 500Mi}
  emulator:
    module: emulator.main:app
    # НЕ дублировать: состояние эмуляции (машины, циклы, сценарии) в памяти пода и фоновый цикл;
    # две копии слали бы двойные события и расходились бы в состоянии
    replicas: 1
    # Recreate: при деплое старый под гасится до запуска нового (RollingUpdate на время раската держал бы две копии)
    strategy: {type: Recreate}
    resources:
      requests: {cpu: 30m, memory: 80Mi}
      limits: {memory: 160Mi}
  ingest:
    module: ingest.main:app
    # копии делят durable-консьюмер NATS JetStream — каждое событие обрабатывает одна копия
    replicas: 1
    resources:
      requests: {cpu: 30m, memory: 60Mi}
      limits: {memory: 120Mi}
    hpa: {max: 3, cpu: 60}
  alerts:
    module: alerts.main:app
    # НЕ дублировать: фоновая проверка правил каждые 30 с без блокировки — копии создавали бы
    # одни и те же алерты одновременно и дублировали уведомления в Telegram
    replicas: 1
    strategy: {type: Recreate}
    resources:
      requests: {cpu: 20m, memory: 70Mi}
      limits: {memory: 130Mi}

web:
  # статика nginx без состояния
  replicas: 2
  <<: *zeroDowntime
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 48Mi}
  # nginx.conf интерфейса → ConfigMap web-nginx. Правка здесь + деплой = новый под web (checksum/config)
  nginxConf: |
    server {
      listen 8080;
      server_tokens off;
      root /usr/share/nginx/html;
      gzip on;
      gzip_types text/css application/javascript application/json image/svg+xml;
      location = /healthz { access_log off; return 200 "ok"; }
      location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
      location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
    }

# Необязательно: Telegram для алертов
telegram:
  botToken: ""
  chatId: ""
