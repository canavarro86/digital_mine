# Учётная запись сервисов: только чтение подов и HPA своего пространства (страница «Платформа»)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: digital-mine
  labels: {{- include "dm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: digital-mine-read
  labels: {{- include "dm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: digital-mine-read
  labels: {{- include "dm.labels" . | nindent 4 }}
subjects:
  - {kind: ServiceAccount, name: digital-mine, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: digital-mine-read}
