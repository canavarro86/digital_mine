# Traefik: / -> web (в т.ч. /console), /api -> api. /grafana — Ingress чарта Grafana.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-mine
  labels: {{- include "dm.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}
