     params: {bucket_m3: 6.4, payload_t: 14, mucking_tph: 120, width_m: 2.8, height_m: 2.56}}
  - {manufacturer: Epiroc, model: Scooptram ST7, short_name: ST7, type: lhd, source: epiroc_scooptram_family,
