# Библиотека пород и параметры геологии. Новые параметры добавляются в extra_params без программиста.
water_levels: [dry, damp, dripping, flowing, inflow]
fracture_categories:
  1: {name: "I — монолитная", spacing_m: ">1.5", structure_coef: 1.1}
  2: {name: "II — малотрещиноватая", spacing_m: "1.0–1.5", structure_coef: 1.2}
  3: {name: "III — среднетрещиноватая", spacing_m: "0.5–1.0", structure_coef: 1.4}
  4: {name: "IV — сильнотрещиноватая", spacing_m: "0.1–0.5", structure_coef: 1.6}
  5: {name: "V — раздробленная", spacing_m: "<0.1", structure_coef: 2.0}
fault_types: [fault, cleavage, crush_zone, blocky]
extra_params:
  - {key: abrasiveness, label: {ru: "Абразивность", en: "Abrasiveness", es: "Abrasividad"}, unit: "мг", type: number}
  - {key: sulfides, label: {ru: "Сульфиды", en: "Sulphides", es: "Sulfuros"}, unit: "%", type: number}
rocks:
